spring.application.name=satya-backend

server.address=${SATYA_BACKEND_BIND_ADDRESS:127.0.0.1}
server.port=${SATYA_BACKEND_PORT:8080}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.datasource.url=jdbc:mysql://localhost:3307/student_crud_db
spring.datasource.username=root
spring.datasource.password=mani1234
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

spring.jackson.deserialization.fail-on-unknown-properties=true

satya.ai.mode=${SATYA_AI_MODE:mock}
satya.ai.base-url=${SATYA_AI_BASE_URL:}
satya.ai.internal-token=${SATYA_INTERNAL_TOKEN:}

satya.corpus.revision=${SATYA_CORPUS_REVISION:}
satya.corpus.allowed-hosts=${SATYA_OFFICIAL_HOSTS:cic.gov.in,dopt.gov.in,rti.gov.in}
satya.import-file=${SATYA_IMPORT_FILE:}

satya.frontend.allowed-origins=${SATYA_ALLOWED_FRONTEND_ORIGINS:http://127.0.0.1:5173}
satya.demo-token=${SATYA_DEMO_TOKEN:}